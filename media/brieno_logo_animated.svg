<svg width="100%" viewBox="0 0 582 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Brieno — Nanopore Signal Foundation Model</title>
<desc>Animated logo: a stylized elephantfish (Mormyridae) with a biphasic electric-organ-discharge pulse train. Wordmark set in Michroma, converted to outlines.</desc>
<style>
.fish { fill: #0F6E56 }
.fin  { fill: #0C5A45 }
svg   { --sig-base: #5DCAA5; --sig-peak: #1D9E75 }
.sig  { stroke: var(--sig-base); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round }
.wm   { fill: #0F6E56 }
.sub  { fill: #1D9E75 }
@media (prefers-color-scheme: dark) {
  .fish { fill: #5DCAA5 }
  .fin  { fill: #4BBFA0 }
  svg   { --sig-base: #9FE1CB; --sig-peak: #E3FAF1 }
  .wm   { fill: #5DCAA5 }
  .sub  { fill: #9FE1CB }
}
/* signal pulse runs on the same 4s clock as the fins: draws in dim, peaks exactly when the fins are fully open (40%) */
#eod-path { opacity: 0.35; stroke-dasharray: 400; stroke-dashoffset: 400;
  animation: drawSignal 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards, pulseSignal 4s ease-in-out 1.8s infinite; }
@keyframes drawSignal { to { stroke-dashoffset: 0; } }
@keyframes pulseSignal { 0%, 100% { opacity: 0.35; stroke: var(--sig-base); } 40% { opacity: 1; stroke: var(--sig-peak); } }

/* fins pivot at their anterior base and sway outward (no hidden filler pieces) */
#fin-dorsal { transform-origin: 172px 48px;  animation: swayDorsal 4s ease-in-out 1.8s infinite; }
#fin-anal   { transform-origin: 198px 137px; animation: swayAnal   4s ease-in-out 1.8s infinite; }
@keyframes swayDorsal { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(12deg); }  70% { transform: rotate(2deg); } }
@keyframes swayAnal   { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-12deg); } 70% { transform: rotate(-2deg); } }
#fin-pec { transform-origin: 228px 105px; animation: flutter 2.5s ease-in-out 2s infinite; }
@keyframes flutter { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }

/* eye: pupil glances toward the discharge at the 40% peak; a quick blink every other cycle (8s) */
/* trunk probes: lifts at the 40% peak, dips on the way back */
#trunk { transform-origin: 338px 113px; animation: probe 4s ease-in-out 1.8s infinite; }
@keyframes probe { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-7deg); } 70% { transform: rotate(3deg); } }
#pupil { animation: glance 4s ease-in-out 1.8s infinite; }
@keyframes glance { 0%, 25%, 75%, 100% { transform: translate(0, 0); } 40%, 58% { transform: translate(2.2px, 0.6px); } }
#eye { transform-origin: 332px 76px; animation: blink 8s ease-in-out 1.8s infinite; }
@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 93.5% { transform: scaleY(0.08); } 96% { transform: scaleY(1); } }

.dot { animation: dotPulse var(--d, 3s) ease-in-out var(--dl, 0s) infinite; }
@keyframes dotPulse { 0%, 100% { opacity: 0.12; r: var(--r0); } 50% { opacity: 0.5; r: var(--r1); } }
</style>

