<circle cx="332" cy="76" r="9" fill="white"/>
<g id="pupil">
<circle cx="334" cy="77" r="5" fill="#093D30"/>
<circle class="fish" cx="334" cy="77" r="5"/>
<circle cx="332" cy="74" r="2" fill="white" opacity="0.5"/>
</g>
</g>
