[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brieno"
dynamic = ["version"]
description = "A foundation model for raw nanopore signal through discrete tokenization"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Guangzhao Cheng" }]
keywords = ["nanopore", "foundation model", "self-supervised learning", "basecalling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "tqdm>=4.60",
]

[project.scripts]
brieno = "brieno.cli:main"

[project.optional-dependencies]
# Raw-signal input formats: install whichever your data is in.
fast5 = ["ont-fast5-api>=4.0"]
pod5 = ["pod5>=0.3"]
# CRF beam search on CPU (open-source Rust; x86_64 and aarch64 wheels).
decode = ["fast-ctc-decode>=0.3"]
# CRF loss / Viterbi need a CUDA backend. `ont-koi` ships x86_64 wheels only;
# `cupy` builds the same seqdist kernels at run time on any CUDA platform.
cuda = ["cupy>=12"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/guangzhaocs/Brieno"
Repository = "https://github.com/guangzhaocs/Brieno"

[tool.setuptools.dynamic]
version = { attr = "brieno.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
